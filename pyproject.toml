[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "untok"
version = "0.1.0"
description = "SentencePiece Unigram tokenizers with Latin and Indic language support"
readme = "README.md"
license-files = ["THIRD_PARTY.md", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["sentencepiece==0.2.1", "protobuf>=4.25,<7"]

[project.optional-dependencies]
legacy-bpe = ["tokenizers==0.22.2"]
test = ["pytest>=8,<10", "numpy>=1.26,<3"]
checkpoint = ["torch>=2.8,<3", "PyYAML>=6,<7", "safetensors>=0.6,<1"]

[project.scripts]
untok = "untok.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
untok = ["data/*/*.json", "data/*/*.model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
