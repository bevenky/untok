[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "untok"
version = "0.1.0"
description = "Native Unigram tokenizer extensions for NVIDIA Nemotron ASR"
requires-python = ">=3.11"
dependencies = ["sentencepiece==0.2.1", "protobuf>=4.25,<7"]

[project.optional-dependencies]
legacy-bpe = ["tokenizers==0.22.2"]
test = ["pytest>=8,<10"]
checkpoint = ["torch>=2.8,<3", "PyYAML>=6,<7", "safetensors>=0.6,<1"]

[project.scripts]
untok = "untok.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
