name: Tokenizer CPU checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,checkpoint,legacy-bpe]'
      - name: Check the installed command
        run: untok --help
      - name: Run CPU unit and bundle contract tests
        run: python -m pytest -q
